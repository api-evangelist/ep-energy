aid: ep-energy
name: EP Energy
description: >-
  EP Energy Corporation was an independent exploration and production company engaged in
  the acquisition and development of unconventional onshore oil and natural gas properties
  in the United States, principally in the Eagle Ford shale and the Uinta basin. The company
  filed for Chapter 11 bankruptcy in October 2019 and emerged in October 2020. Verdun Oil
  Company II LLC, an EnCap Investments portfolio company, completed its acquisition of EP
  Energy on 30 March 2022 for approximately $1.45 billion, with the Utah/Uinta assets
  divested post-closing under an FTC order. EP Energy is no longer an operating company.
  It never published an API, SDK, or developer program, and its corporate domain
  epenergy.com now redirects to the acquirer, verdunoilco.com. The unrelated hyphenated
  domain ep-energy.com is a GoDaddy aftermarket listing offered for sale and is not an
  EP Energy surface.
